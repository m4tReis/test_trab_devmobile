<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Área do administrador · Santos e Schein</title>
    <style>
        :root {
            --azul: #1f3fa8;
            --azul-escuro: #172f7d;
            --laranja: #f28c00;
            --fundo: #f3f5fa;
            --cartao: #ffffff;
            --texto: #1c2333;
            --suave: #5d6782;
            --borda: #dde2ee;
            --ok: #1d7a46;
            --ok-fundo: #e3f4ea;
            --aberto: #1f3fa8;
            --aberto-fundo: #e4eafb;
            --exp: #8a5a00;
            --exp-fundo: #fdf0dc;
            --erro: #b42318;
            --erro-fundo: #fdecea;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--fundo);
            color: var(--texto);
            font-size: 15px;
        }

        header {
            background: var(--azul);
            color: #fff;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        header h1 { font-size: 18px; margin: 0; font-weight: 600; }
        header h1 span { color: var(--laranja); }
        header .usuario { display: flex; align-items: center; gap: 14px; font-size: 14px; }

        main { max-width: 1120px; margin: 32px auto; padding: 0 24px; }

        .cartao {
            background: var(--cartao);
            border: 1px solid var(--borda);
            border-radius: 12px;
            padding: 24px;
        }

        #tela-login .cartao { max-width: 380px; margin: 48px auto; }
        #tela-login h2 { margin: 0 0 4px; font-size: 22px; }
        #tela-login p.sub { margin: 0 0 20px; color: var(--suave); }

        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--suave); }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--borda);
            border-radius: 8px;
            font: inherit;
            background: #fff;
            color: var(--texto);
        }

        input:focus, select:focus { outline: 2px solid var(--azul); outline-offset: -1px; }

        .campo { margin-bottom: 16px; }

        button {
            font: inherit;
            border: 0;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 600;
        }

        button.primario { background: var(--laranja); color: #fff; }
        button.primario:hover { filter: brightness(0.95); }
        button.secundario { background: #fff; color: var(--azul); border: 1px solid var(--borda); }
        button.sair { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.6); padding: 6px 14px; }
        button:disabled { opacity: 0.55; cursor: default; }

        #tela-login button.primario { width: 100%; }

        .mensagem {
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .mensagem.erro { background: var(--erro-fundo); color: var(--erro); }
        .mensagem.info { background: var(--aberto-fundo); color: var(--aberto); }
        [hidden] { display: none !important; }

        .filtros {
            display: grid;
            grid-template-columns: 170px 170px 1fr auto;
            gap: 16px;
            align-items: end;
            margin-bottom: 20px;
        }

        .filtros .campo { margin-bottom: 0; }

        h2.titulo { margin: 0 0 16px; font-size: 20px; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--borda); }
        th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--suave); background: #f8f9fc; }
        th.grupo { text-align: center; border-bottom: 0; }
        td.num { font-variant-numeric: tabular-nums; }
        td.vazio-celula { color: var(--suave); }

        .situacao {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .situacao.LOGOUT { background: var(--ok-fundo); color: var(--ok); }
        .situacao.EM_ABERTO { background: var(--aberto-fundo); color: var(--aberto); }
        .situacao.EXPIRADA { background: var(--exp-fundo); color: var(--exp); }

        .sem-resultados { text-align: center; color: var(--suave); padding: 28px 12px; }

        .paginacao {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            color: var(--suave);
            font-size: 14px;
        }

        .paginacao .botoes { display: flex; gap: 8px; }

        @media (max-width: 760px) {
            header { padding: 12px 16px; }
            main { padding: 0 16px; }
            .filtros { grid-template-columns: 1fr 1fr; }
            .tabela-rolagem { overflow-x: auto; }
        }
    </style>
</head>
<body>
<header>
    <h1>Complexo Esportivo <span>Santos e Schein</span> · Administração</h1>
    <div class="usuario" id="cabecalho-usuario" hidden>
        <span id="email-admin"></span>
        <button class="sair" id="botao-sair" type="button">Sair</button>
    </div>
</header>

<main>
    <!-- Tela de entrada -->
    <section id="tela-login">
        <div class="cartao">
            <h2>Área do administrador</h2>
            <p class="sub">Entre com seu e-mail e senha.</p>
            <div class="mensagem erro" id="erro-login" hidden></div>
            <div class="mensagem info" id="info-login" hidden></div>
            <form id="form-login" novalidate>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" autocomplete="username" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" autocomplete="current-password" required>
                </div>
                <button class="primario" id="botao-entrar" type="submit">Entrar</button>
            </form>
        </div>
    </section>

    <!-- Historico de acessos -->
    <section id="tela-historico" hidden>
        <div class="cartao">
            <h2 class="titulo">Histórico de acessos</h2>
            <div class="mensagem erro" id="erro-historico" hidden></div>
            <form class="filtros" id="form-filtros">
                <div class="campo">
                    <label for="filtro-de">De</label>
                    <input id="filtro-de" type="date">
                </div>
                <div class="campo">
                    <label for="filtro-ate">Até</label>
                    <input id="filtro-ate" type="date">
                </div>
                <div class="campo">
                    <label for="filtro-usuario">Usuário</label>
                    <select id="filtro-usuario">
                        <option value="">Todos os usuários</option>
                    </select>
                </div>
                <button class="primario" type="submit">Filtrar</button>
            </form>

            <div class="tabela-rolagem">
                <table>
                    <thead>
                    <tr>
                        <th rowspan="2">Nome</th>
                        <th rowspan="2">Aparelho</th>
                        <th class="grupo" colspan="2">Login</th>
                        <th class="grupo" colspan="2">Logout</th>
                        <th rowspan="2">Situação</th>
                    </tr>
                    <tr>
                        <th>Data</th>
                        <th>Hora</th>
                        <th>Data</th>
                        <th>Hora</th>
                    </tr>
                    </thead>
                    <tbody id="linhas"></tbody>
                </table>
            </div>

            <div class="paginacao">
                <span id="resumo-paginacao"></span>
                <div class="botoes">
                    <button class="secundario" id="pagina-anterior" type="button">Anterior</button>
                    <button class="secundario" id="pagina-proxima" type="button">Próxima</button>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
    (function () {
        "use strict";

        var CHAVE_TOKEN = "santosschein.admin.token";
        var CHAVE_EMAIL = "santosschein.admin.email";
        var TAMANHO_PAGINA = 20;
        var SITUACOES = {
            LOGOUT: "Saída confirmada",
            EM_ABERTO: "Em aberto",
            EXPIRADA: "Expirada"
        };

        var paginaAtual = 0;
        var totalPaginas = 0;

        function $(id) { return document.getElementById(id); }

        function lerArmazenado(chave) {
            try { return sessionStorage.getItem(chave); } catch (e) { return null; }
        }

        function gravarArmazenado(chave, valor) {
            try {
                if (valor === null) { sessionStorage.removeItem(chave); } else { sessionStorage.setItem(chave, valor); }
            } catch (e) { /* sem armazenamento: a sessao vale so enquanto a pagina estiver aberta */ }
        }

        var tokenEmMemoria = lerArmazenado(CHAVE_TOKEN);

        function token() { return tokenEmMemoria; }

        function guardarSessao(novoToken, email) {
            tokenEmMemoria = novoToken;
            gravarArmazenado(CHAVE_TOKEN, novoToken);
            gravarArmazenado(CHAVE_EMAIL, email);
        }

        function limparSessao() {
            tokenEmMemoria = null;
            gravarArmazenado(CHAVE_TOKEN, null);
            gravarArmazenado(CHAVE_EMAIL, null);
        }

        function mostrar(elemento, texto) {
            elemento.textContent = texto;
            elemento.hidden = !texto;
        }

        function api(caminho, opcoes) {
            opcoes = opcoes || {};
            var cabecalhos = opcoes.headers || {};
            if (token()) { cabecalhos["Authorization"] = "Bearer " + token(); }
            opcoes.headers = cabecalhos;
            return fetch(caminho, opcoes);
        }

        function mostrarLogin(mensagemErro, mensagemInfo) {
            $("tela-historico").hidden = true;
            $("cabecalho-usuario").hidden = true;
            $("tela-login").hidden = false;
            mostrar($("erro-login"), mensagemErro || "");
            mostrar($("info-login"), mensagemInfo || "");
            $("senha").value = "";
        }

        function mostrarHistorico() {
            $("tela-login").hidden = true;
            $("tela-historico").hidden = false;
            $("cabecalho-usuario").hidden = false;
            $("email-admin").textContent = lerArmazenado(CHAVE_EMAIL) || "";
        }

        function sessaoExpirada() {
            limparSessao();
            mostrarLogin("Sessão expirada. Entre novamente.");
        }

        function encerrarNoServidor() {
            if (!token()) { return Promise.resolve(); }
            return api("/api/v1/auth/logout", { method: "POST" }).catch(function () { /* sem conexao */ });
        }

        // ---- Entrada ----
        $("form-login").addEventListener("submit", function (evento) {
            evento.preventDefault();
            var email = $("email").value.trim();
            var senha = $("senha").value;
            if (!email || !senha) {
                mostrar($("erro-login"), "Informe e-mail e senha.");
                return;
            }

            $("botao-entrar").disabled = true;
            mostrar($("erro-login"), "");
            mostrar($("info-login"), "");

            fetch("/api/v1/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-Device-Name": "Navegador (área admin)" },
                body: JSON.stringify({ email: email, password: senha })
            }).then(function (resposta) {
                if (resposta.status === 401 || resposta.status === 400) {
                    throw new Error("E-mail ou senha inválidos.");
                }
                var cabecalho = resposta.headers.get("Authorization") || "";
                if (!resposta.ok || cabecalho.indexOf("Bearer ") !== 0) {
                    throw new Error("Não foi possível entrar. Tente novamente.");
                }
                guardarSessao(cabecalho.substring(7), email);
                return carregarUsuarios();
            }).then(function (permitido) {
                if (permitido) {
                    mostrarHistorico();
                    return buscar(0);
                }
            }).catch(function (erro) {
                mostrar($("erro-login"), erro.message || "Não foi possível entrar. Tente novamente.");
            }).then(function () {
                $("botao-entrar").disabled = false;
            });
        });

        // ---- Lista de usuarios (tambem confirma o perfil ADMIN) ----
        function carregarUsuarios() {
            return api("/api/v1/admin/users").then(function (resposta) {
                if (resposta.status === 403) {
                    // Cliente sem perfil administrativo: encerra a sessao recem-criada pelo mesmo fluxo de log.
                    return encerrarNoServidor().then(function () {
                        limparSessao();
                        mostrarLogin("Acesso restrito ao administrador.");
                        return false;
                    });
                }
                if (resposta.status === 401) {
                    sessaoExpirada();
                    return false;
                }
                if (!resposta.ok) { throw new Error("Não foi possível carregar os usuários."); }
                return resposta.json().then(function (usuarios) {
                    var select = $("filtro-usuario");
                    while (select.options.length > 1) { select.remove(1); }
                    usuarios.forEach(function (usuario) {
                        var opcao = document.createElement("option");
                        opcao.value = String(usuario.id);
                        opcao.textContent = usuario.name + " (" + usuario.email + ")";
                        select.appendChild(opcao);
                    });
                    return true;
                });
            });
        }

        // ---- Historico ----
        function dataLocal(deslocamentoDias) {
            var d = new Date();
            d.setDate(d.getDate() + deslocamentoDias);
            var mes = String(d.getMonth() + 1).padStart(2, "0");
            var dia = String(d.getDate()).padStart(2, "0");
            return d.getFullYear() + "-" + mes + "-" + dia;
        }

        function celula(texto, classe) {
            var td = document.createElement("td");
            td.textContent = texto;
            if (classe) { td.className = classe; }
            return td;
        }

        function renderizar(pagina) {
            var corpo = $("linhas");
            corpo.textContent = "";

            if (!pagina.items || pagina.items.length === 0) {
                var tr = document.createElement("tr");
                var td = celula("Nenhum acesso encontrado para os filtros informados", "sem-resultados");
                td.colSpan = 7;
                tr.appendChild(td);
                corpo.appendChild(tr);
            } else {
                pagina.items.forEach(function (acesso) {
                    var tr = document.createElement("tr");
                    tr.appendChild(celula(acesso.userName));
                    tr.appendChild(celula(acesso.device || "—", acesso.device ? "" : "vazio-celula"));
                    tr.appendChild(celula(acesso.loginDate, "num"));
                    tr.appendChild(celula(acesso.loginTime, "num"));
                    tr.appendChild(celula(acesso.logoutDate || "—", acesso.logoutDate ? "num" : "vazio-celula"));
                    tr.appendChild(celula(acesso.logoutTime || "—", acesso.logoutTime ? "num" : "vazio-celula"));
                    var tdSituacao = document.createElement("td");
                    var etiqueta = document.createElement("span");
                    etiqueta.className = "situacao " + acesso.status;
                    etiqueta.textContent = SITUACOES[acesso.status] || acesso.status;
                    tdSituacao.appendChild(etiqueta);
                    tr.appendChild(tdSituacao);
                    corpo.appendChild(tr);
                });
            }

            paginaAtual = pagina.page;
            totalPaginas = pagina.totalPages;
            var total = pagina.totalElements;
            $("resumo-paginacao").textContent = total === 0
                ? "0 acessos"
                : total + (total === 1 ? " acesso" : " acessos") + " · página " + (paginaAtual + 1) + " de " + Math.max(totalPaginas, 1);
            $("pagina-anterior").disabled = paginaAtual <= 0;
            $("pagina-proxima").disabled = paginaAtual + 1 >= totalPaginas;
        }

        function buscar(pagina) {
            var de = $("filtro-de").value;
            var ate = $("filtro-ate").value;
            if (de && ate && de > ate) {
                mostrar($("erro-historico"), "A data inicial deve ser anterior ou igual à data final.");
                return Promise.resolve();
            }
            mostrar($("erro-historico"), "");

            var parametros = new URLSearchParams();
            if (de) { parametros.set("from", de); }
            if (ate) { parametros.set("to", ate); }
            if ($("filtro-usuario").value) { parametros.set("userId", $("filtro-usuario").value); }
            parametros.set("page", String(pagina));
            parametros.set("size", String(TAMANHO_PAGINA));

            return api("/api/v1/admin/access-logs?" + parametros.toString()).then(function (resposta) {
                if (resposta.status === 401) { sessaoExpirada(); return; }
                if (resposta.status === 403) { limparSessao(); mostrarLogin("Acesso restrito ao administrador."); return; }
                if (!resposta.ok) {
                    return resposta.json().catch(function () { return {}; }).then(function (corpo) {
                        mostrar($("erro-historico"), corpo.message || "Não foi possível consultar o histórico.");
                    });
                }
                return resposta.json().then(renderizar);
            }).catch(function () {
                mostrar($("erro-historico"), "Não foi possível conectar ao servidor.");
            });
        }

        $("form-filtros").addEventListener("submit", function (evento) {
            evento.preventDefault();
            buscar(0);
        });

        $("pagina-anterior").addEventListener("click", function () {
            if (paginaAtual > 0) { buscar(paginaAtual - 1); }
        });

        $("pagina-proxima").addEventListener("click", function () {
            if (paginaAtual + 1 < totalPaginas) { buscar(paginaAtual + 1); }
        });

        // ---- Saida ----
        $("botao-sair").addEventListener("click", function () {
            encerrarNoServidor().then(function () {
                limparSessao();
                mostrarLogin("", "Você saiu da área administrativa.");
            });
        });

        // ---- Inicio ----
        $("filtro-de").value = dataLocal(-7);
        $("filtro-ate").value = dataLocal(0);

        if (token()) {
            carregarUsuarios().then(function (permitido) {
                if (permitido) {
                    mostrarHistorico();
                    return buscar(0);
                }
            }).catch(function () {
                mostrarLogin("Não foi possível conectar ao servidor.");
            });
        } else {
            mostrarLogin();
        }
    })();
</script>
</body>
</html>
