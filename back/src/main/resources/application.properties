spring.application.name=ComplexoSantosScheinBackend
server.port=8080

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=complexo
spring.datasource.password=complexo
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=NUMERIC

app.jwt.secret=change-this-local-development-secret-with-at-least-256-bits
app.jwt.expiration-seconds=3600
app.reservation.slot-minutes=60
app.reservation.minimum-cancel-hours=24
